name: Fetch ChatGPT source attachment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-chatgpt-source.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Try ChatGPT file download endpoints
        shell: bash
        run: |
          set +e
          for u in \
            'https://chatgpt.com/backend-api/files/file_00000000c66481f4a190554c98914944/download' \
            'https://chatgpt.com/backend-api/files/download/file_00000000c66481f4a190554c98914944'; do
            echo "URL=$u"
            rm -f candidate.bin headers.txt
            curl -L -sS -D headers.txt -o candidate.bin "$u"
            code=$?
            echo "curl_exit=$code size=$(wc -c < candidate.bin 2>/dev/null || echo 0)"
            head -20 headers.txt || true
            file candidate.bin || true
            python -c "import zipfile,pathlib; p=pathlib.Path('candidate.bin'); print('exists',p.exists(),'size',p.stat().st_size if p.exists() else 0,'is_zip',zipfile.is_zipfile(p) if p.exists() else False)"
          done
