name: Build JJU formal report

on:
  workflow_dispatch:
  push:
    paths:
      - 'build_jju_report.py'
      - '.github/workflows/build-jju-report.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip python-docx lxml

      - name: Apply python-docx compatibility fix
        run: |
          sed -i 's/, WD_SECTION_VERTICAL_ALIGNMENT//' build_jju_report.py
          sed -i '/vertical_alignment = WD_SECTION_VERTICAL_ALIGNMENT/d' build_jju_report.py

      - name: Build Word report
        run: python build_jju_report.py

      - name: Validate Word report
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          from docx import Document
          p = Path('九江学院2023—2025年临床执业医师资格考试综合分析报告_正式版.docx')
          assert p.exists() and p.stat().st_size > 30000, p
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'word/document.xml' in z.namelist()
          d = Document(p)
          text = '\n'.join([x.text for x in d.paragraphs] + [c.text for t in d.tables for r in t.rows for c in r.cells])
          banned = ['台账','蓝图','画像','数据治理','年度诊断','根因','复盘','精准支持','尚不能','不能据此','不能仅据','不宜据此','不宜仅凭','据此认定','相对教学成效持续改善','仅凭原始掌握率','风险提示']
          found = [x for x in banned if x in text]
          assert not found, found
          assert len(d.tables) >= 10
          assert len(d.paragraphs) >= 80
          print(p, p.stat().st_size, len(d.paragraphs), len(d.tables))

      - name: Upload formal Word report artifact
        uses: actions/upload-artifact@v4
        with:
          name: JJU-formal-report
          path: 九江学院2023—2025年临床执业医师资格考试综合分析报告_正式版.docx
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Word package for direct DOCX download
        shell: python
        run: |
          from pathlib import Path
          import shutil, zipfile
          source = Path('九江学院2023—2025年临床执业医师资格考试综合分析报告_正式版.docx')
          target = Path('docx_package')
          shutil.rmtree(target, ignore_errors=True)
          target.mkdir()
          with zipfile.ZipFile(source) as z:
              z.extractall(target)
          assert (target / '[Content_Types].xml').exists()
          assert (target / 'word' / 'document.xml').exists()

      - name: Upload directly downloadable DOCX package
        uses: actions/upload-artifact@v4
        with:
          name: JJU-formal-docx-package
          path: docx_package/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 6
          retention-days: 7

      - name: Publish formal Word report release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jju-formal-report --yes --cleanup-tag || true
          gh release create jju-formal-report \
            九江学院2023—2025年临床执业医师资格考试综合分析报告_正式版.docx \
            --title '九江学院医师资格考试综合分析报告正式版' \
            --notes '提交学校教学指导委员会和校长办公会审议使用。'
